spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/autotrack?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
    username: ${DB_USERNAME:autotrack}
    password: ${DB_PASSWORD:autotrack-local-password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
