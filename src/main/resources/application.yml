spring:
  application:
    name: autotrack
  profiles:
    default: local
  jpa:
    open-in-view: false
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

app:
  security:
    jwt:
      secret: ${JWT_SECRET:autotrack-local-dev-secret-change-me-2026}
      ttl-minutes: ${JWT_TTL_MINUTES:120}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}
  admin:
    name: ${APP_ADMIN_NAME:AutoTrack Admin}
    email: ${APP_ADMIN_EMAIL:admin@autotrack.local}
    password: ${APP_ADMIN_PASSWORD:Admin123!}
  seed-demo: ${APP_SEED_DEMO:true}
  simulator:
    enabled: ${APP_SIMULATOR_ENABLED:true}
    interval-ms: ${APP_SIMULATOR_INTERVAL_MS:2000}
    initial-delay-ms: ${APP_SIMULATOR_INITIAL_DELAY_MS:3000}
